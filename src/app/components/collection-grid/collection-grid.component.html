<div class="colelction-grid-wrapper">
  <div class="user-info">
    <span class="user-avatar">
      <h1>{{collection.title}}</h1>
    </span>
    <button mat-icon-button aria-label="Clear" (click)="close()">
      <mat-icon fontIcon="close"></mat-icon>
    </button>
  </div>
  <mat-divider></mat-divider>
  <div class="grid-wrapper">
      @for (image of collectionImages(); track image.id) {
      <div class="grid-item">
        <app-image-tile [image]="image"></app-image-tile>
      </div>
      }
      @if (isLoading()) {
        @for (placeholder of imagePlaceholders; track $index) {
          <div class="grid-item skeleton-grid-item" aria-hidden="true">
            <app-skeleton-loader [singleItem]="true" [itemHeight]="315" />
          </div>
        }
      }
    </div>
    <div class="scroll-sentinel" appInfiniteScroll [appInfiniteScrollDisabled]="isLoading() || !hasMoreImages()" (scrolled)="loadMoreImages()" aria-hidden="true"></div>

</div>
